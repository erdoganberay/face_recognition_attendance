services:
  web:
    build: .
    ports:
      - "8000:8000"
      - "8089:8089"
    volumes:
      - .:/app
    command: >
      sh -c "python manage.py makemigrations &&
             python manage.py migrate &&
             gunicorn face_recognition_attendance.wsgi:application --bind 0.0.0.0:8000 --workers 9"
