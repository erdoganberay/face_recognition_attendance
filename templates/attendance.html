{% extends "base.html" %}
{% block title %}Attendance - {{ session.course.code }}{% endblock %}
{% block content %}

<div class="row justify-content-center">
  <div class="col-md-10">
    <div class="card">
      <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
        <h5 class="mb-0"><i class="bi bi-camera-video me-2"></i>{{ session.course.code }} — {{ session.course.name }}</h5>
        <small class="text-white-50">Started: {{ session.started_at|date:"M d, Y H:i" }}</small>
      </div>
      <div class="card-body text-center">
        <video id="video" width="480" height="360" autoplay playsinline muted class="rounded mb-3" style="max-width:100%;"></video>
        <canvas id="canvas" width="480" height="360" style="display:none;"></canvas>
        <div id="result-box" class="alert alert-secondary fs-5 fw-semibold">Waiting for face...</div>
        <form method="post" action="{% url 'end_session' session.id %}">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">End Session</button>
        </form>
        <a href="{% url 'session_report' session.id %}" class="btn btn-outline-secondary btn-sm mt-2">
          Manual Attendance
        </a>
      </div>
    </div>
  </div>
</div>

<script>
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const resultBox = document.getElementById('result-box');

  navigator.mediaDevices.getUserMedia({ video: true })
    .then(stream => { video.srcObject = stream; })
    .catch(err => { resultBox.className = 'alert alert-danger'; resultBox.textContent = 'Camera error: ' + err.message; });

  setInterval(() => {
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const imageData = canvas.toDataURL('image/jpeg');

    fetch("/accounts/recognize/", {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: imageData, session_id: {{ session.id }} })
    })
    .then(res => res.json())
    .then(data => {
      if (data.status === 'recognized') {
        resultBox.className = 'alert alert-success';
        resultBox.textContent = '✓ ' + data.name + ' (' + data.student_id + ')' + (data.already_marked ? ' — already marked' : '');
      } else if (data.status === 'no_face') {
        resultBox.className = 'alert alert-secondary';
        resultBox.textContent = 'No face detected';
      } else if (data.status === 'unknown') {
        resultBox.className = 'alert alert-warning';
        resultBox.textContent = 'Face not recognized';
      }
    })
    .catch(err => console.error(err));
  }, 3000);
</script>

{% endblock %}
