<!-- templates/registration/login.html -->
{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<h2>Log In</h2>
<form method="post">
  {% csrf_token %}
  {{ form }}
  <button type="submit">Log In</button>
  <p><a href="{% url 'signup' %}">Don't have an account? Sign up</a></p>
  <p><a href="{% url 'password_reset' %}">Forgot password?</a></p>
</form>
{% endblock %}
